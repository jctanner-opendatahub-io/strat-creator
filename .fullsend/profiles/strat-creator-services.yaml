id: strat-creator-services
display_name: Strat Creator local services
description: Local Jira, GitLab results, and optional Org Pulse for the POC
category: data
endpoints:
  - host: jira.local
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
  - host: gitlab.local
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
  - host: orgpulse.local
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
  - host: github.com
    port: 443
    protocol: rest
    access: read-only
    enforcement: enforce
  - host: api.github.com
    port: 443
    protocol: rest
    access: read-only
    enforcement: enforce
  - host: raw.githubusercontent.com
    port: 443
    protocol: rest
    access: read-only
    enforcement: enforce
  - host: codeload.github.com
    port: 443
    protocol: rest
    access: read-only
    enforcement: enforce
binaries:
  - "**/bash"
  - "**/sh"
  - "**/git"
  - "**/python3"
  - "**/node"
  - "**/claude"
  - "**/fullsend-claude"
